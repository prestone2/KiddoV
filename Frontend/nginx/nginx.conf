server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static mirrors directly for crawlers (no SPA fallback)
    location ~* ^/(terms|privacy|about|contact|sitemap)\.html$ {
        try_files $uri =404;
    }

    # Allow both /terms and /terms.html
    location ~* ^/(terms|privacy|about|contact|sitemap)$ {
        try_files $uri $uri.html /index.html;
    }

    # Normal SPA fallback
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
}
